[metadata]
name = docker-compose-py
version = 5.7.1.0
description = Python wrapper around invoking the Docker Compose CLI (https://github.com/docker/compose)
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/neeve-ai/docker-compose-py
author = oss-robin
license = Apache License Version 2.0
license_files = LICENSE
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: Implementation :: CPython
    Programming Language :: Python :: Implementation :: PyPy

[options]
python_requires = >=3.11
setup_requires =
    setuptools-download

[setuptools_download]
download_scripts =
    [docker-compose]
    group = docker-compose-binary
    marker = sys_platform == "linux" and platform_machine == "x86_64"
    url = https://github.com/docker/compose/releases/download/v5.7.1/docker-compose-linux-x86_64
    sha256 = af426722a8af5de812fcee30cc1c39f0639f5f723cbadefb25e5d4db054064cf
    [docker-compose]
    group = docker-compose-binary
    marker = sys_platform == "linux" and platform_machine == "aarch64"
    url = https://github.com/docker/compose/releases/download/v5.7.1/docker-compose-linux-aarch64
    sha256 = f2f49f903240895fa764c0dca3a14548b754ad9426f6b609ccaf55ec5a3aa2a5
    [docker-compose]
    group = docker-compose-binary
    marker = sys_platform == "darwin" and platform_machine == "x86_64"
    url = https://github.com/docker/compose/releases/download/v5.7.1/docker-compose-darwin-x86_64
    sha256 = c28b37c7bf1cc315acdf511c2c0f34ce19d4d33b6038611617063a99c45417c6
    [docker-compose]
    group = docker-compose-binary
    marker = sys_platform == "darwin" and platform_machine == "arm64"
    url = https://github.com/docker/compose/releases/download/v5.7.1/docker-compose-darwin-aarch64
    sha256 = 5a9aa8b5fb5b1e3cd83f39c80e570ae30aafd74cd9b47264fbe4ff7e6e6251ca
    [docker-compose.exe]
    group = docker-compose-binary
    marker = sys_platform == "win32" and platform_machine == "AMD64"
    url = https://github.com/docker/compose/releases/download/v5.7.1/docker-compose-windows-x86_64.exe
    sha256 = e4316597452650ae92fe9719a2a7c2fce8f56c5ceafed88d2aed6e39b2b2b2d0
    [docker-compose.exe]
    group = docker-compose-binary
    marker = sys_platform == "win32" and platform_machine == "ARM64"
    url = https://github.com/docker/compose/releases/download/v5.7.1/docker-compose-windows-aarch64.exe
    sha256 = 3ed47ab4d1cd56d63981246820420e7aaf042f2a48e6ccc95993872980a4e0a9
